general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
}

shape {
    monitor =
    size = 360, 440
    color = rgba(12, 15, 25, 0.45)
    rounding = 28
    border_size = 1
    border_color = rgba(255, 255, 255, 0.16)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.96)
    font_size = 56
    font_family = Noto Sans
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.80)
    font_size = 15
    font_family = Noto Sans
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.18
    inner_color = rgba(255, 255, 255, 0.12)
    outer_color = rgba(255, 255, 255, 0.24)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -83
    halign = center
    valign = center
}
